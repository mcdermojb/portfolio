baseURL = 'https://mcdermojb.github.io/portfolio/'
theme = 'PaperMod'
title = 'Joe McDermott'

# Robust Pathing for GitHub Pages Subfolder Hosting
relativeURLs = false
canonifyURLs = false

[markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
    env = 'production'
    mainSections = ["none"]
    description = "Senior Principal Information Developer specializing in REST APIs, enterprise security, and AI-augmented workflows."
    showbreadcrumbs = true     # Enforces clean navigation paths at the top of topics
    showtoc = true             # Keeps the TOC data compiling
    tocopen = true        

[params.profileMode]
    enable = false           

[params.assets]
    disableFingerprinting = false 

# SOCIAL ICONS
[[params.socialIcons]]
    name = "github"
    url = "https://github.com/mcdermojb"

[[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/joe-b-mcdermott"

[[params.socialIcons]]
    name = "email"
    url = "mailto:mcd.joe@icloud.com"

# MAIN MENU NAVIGATION
[[menu.main]]
    name = "Home"
    url = ""                 # Maps directly to your baseURL root
    weight = 10

[[menu.main]]
    name = "Work"
    url = "portfolio/"       # Relative to baseURL (resolves to /portfolio/portfolio/)
    weight = 20

[[menu.main]]
    name = "Resume"
    url = "resume/"
    weight = 50

[[menu.main]]
    name = "Contact"
    url = "contact/"
    weight = 60

[[menu.main]]
    name = "Writing"
    url = "posts/"
    weight = 30

[params.footer]
    content = "© 2026 Joe McDermott. All rights reserved. Licensed under CC BY-NC-ND 4.0."
