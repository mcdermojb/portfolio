baseURL = 'https://mcdermojb.github.io/portfolio/'
theme = 'PaperMod'
title = 'Joe McDermott'

# Pathing Logic for Git
relativeURLs = false
canonifyURLs = true

[params]
    env = 'production'
    mainSections = ["posts"]
    description = "Senior Principal Information Developer specializing in REST APIs, enterprise security, and AI-augmented workflows."
    ShowToc = true          # Enables the TOC
    TocOpen = false          # Keeps the TOC expanded by default (recommended for long case studies)

[params.profileMode]
    enabled = true
    title = "Joe McDermott"
    subtitle = "Information Developer and Content Engineer | Translating complex code into actionable information."
    imageUrl = "" 

    [[params.profileMode.buttons]]
        name = "About"
        url = "about/"

    [[params.profileMode.buttons]]
        name = "Case Studies"
        url = "case-studies/"

    [[params.profileMode.buttons]]
        name = "Samples"
        url = "samples/"

    [[params.profileMode.buttons]]
        name = "Projects"
        url = "projects/"

    [[params.profileMode.buttons]]
        name = "Posts"
        url = "posts/"

[params.assets]
    disableFingerprinting = false 

# SOCIAL ICONS
[[params.socialIcons]]
    name = "github"
    url = "https://github.com/mcdermojb"

[[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/joe-b-mcdermott"

[[params.socialIcons]]
    name = "email"
    url = "mailto:mcd.joe@icloud.com"

# MAIN MENU NAVIGATION
[[menu.main]]
    identifier = "about"
    name = "About"
    url = "about/"
    weight = 10

[[menu.main]]
    identifier = "case-studies"
    name = "Case Studies"
    url = "case-studies/"
    weight = 20

[[menu.main]]
    identifier = "samples"
    name = "Samples"
    url = "samples/"
    weight = 30

[[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "projects/"
    weight = 40

[[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "posts/"
    weight = 50

[params.footer]
    content = "© 2026 Joe McDermott. All rights reserved. Licensed under CC BY-NC-ND 4.0."